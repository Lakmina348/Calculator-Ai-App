<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Google Docs Pro 🚀</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Rajdhani', sans-serif;
}

body {
background: #060a17;
color: white;
padding: 20px;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
flex-direction: column;
overflow-x: hidden;
}

.main-container {
width: 100%;
max-width: 700px;
background: #0d1527;
border: 2px solid #00ffff;
border-radius: 24px;
padding: 25px;
box-shadow: 0 0 25px #00ffff44;
position: relative;
}

/* Header Setup */
.header-area {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
padding-bottom: 15px;
}

.title {
font-family: 'Orbitron', sans-serif;
font-size: 24px;
color: #00ffff;
text-shadow: 0 0 15px #00ffff;
font-weight: bold;
display: flex;
align-items: center;
gap: 10px;
}

.nav-btn {
background: linear-gradient(135deg, #ffaa00, #ff6600);
color: black;
font-family: 'Orbitron', sans-serif;
font-weight: bold;
padding: 10px 16px;
border-radius: 12px;
border: none;
cursor: pointer;
box-shadow: 0 0 15px #ffaa0055;
transition: 0.3s;
text-decoration: none;
font-size: 14px;
}

.nav-btn:hover {
transform: translateY(-2px);
box-shadow: 0 0 25px #ffaa0099;
}

/* UI Card Boxes Style */
.ui-card-box {
background: #0d1527;
border: 2px solid #00ffff;
border-radius: 20px;
padding: 15px;
margin-bottom: 20px;
box-shadow: 0 0 15px #00ffff22;
}

.box-title {
font-size: 18px;
color: #00ffff;
font-weight: bold;
margin-bottom: 12px;
letter-spacing: 0.5px;
}

/* Toolbar Buttons */
.doc-toolbar {
display: flex;
flex-wrap: wrap;
gap: 8px;
align-items: center;
}

.btn-tool {
background: #00ffff;
color: #000000;
border: none;
padding: 8px 14px;
font-size: 14px;
font-weight: bold;
border-radius: 8px;
cursor: pointer;
transition: 0.2s;
box-shadow: 0 0 10px #00ffff55;
}

.btn-tool:hover {
background: #ffffff;
box-shadow: 0 0 15px #ffffff;
transform: scale(1.05);
}

select {
background: #1f2937;
color: white;
border: 1px solid #00ffff44;
padding: 7px 10px;
border-radius: 8px;
outline: none;
cursor: pointer;
font-weight: bold;
font-size: 14px;
}

select:hover {
border-color: #00ffff;
box-shadow: 0 0 8px #00ffff44;
}

/* Editor Container */
.google-doc-page {
width: 100%;
min-height: 350px;
max-height: 500px;
background: #1f2937;
border: 1px solid #374151;
border-radius: 12px;
padding: 20px;
font-size: 18px;
line-height: 1.6;
color: #ffffff; 
outline: none;
overflow-y: auto;
}

/* Emoji Bar */
.emoji-bar {
display: flex;
gap: 10px;
overflow-x: auto;
padding: 5px 0;
}

.emoji-btn {
font-size: 22px;
background: none;
border: none;
cursor: pointer;
transition: 0.2s;
}

.emoji-btn:hover {
transform: scale(1.3);
}

/* Reset Button */
.resetBtn {
width: 100%;
padding: 14px;
background: #ff3333;
color: white;
font-family: 'Rajdhani', sans-serif;
font-size: 18px;
font-weight: bold;
border-radius: 12px;
border: none;
cursor: pointer;
transition: 0.3s;
box-shadow: 0 0 15px rgba(255, 51, 51, 0.3);
letter-spacing: 0.5px;
}

.resetBtn:hover {
background: #ff1111;
box-shadow: 0 0 25px #ff3333aa;
}

.status-footer {
text-align: center;
margin-top: 15px;
font-size: 14px;
color: #a0aec0;
font-weight: 500;
}

/* =======================================================
   ADVANCED DRAGGABLE & RESIZABLE WINDOW SYSTEM (1.html)
   ======================================================= */
.calc-window {
position: fixed;
top: 15%;
left: 30%;
width: 360px;
height: 480px;
background: #0d1527;
border: 2px solid #ffaa00;
border-radius: 16px;
box-shadow: 0 0 30px rgba(255, 170, 0, 0.4);
z-index: 9999;
display: none; /* Hidden by default */
flex-direction: column;
overflow: hidden;
transition: width 0.2s, height 0.2s;
}

/* Window Header Bar */
.window-header {
background: #111827;
padding: 10px 15px;
display: flex;
justify-content: space-between;
align-items: center;
cursor: move; /* Shows hand drag cursor */
border-bottom: 2px solid #ffaa0033;
user-select: none;
}

.window-title {
font-family: 'Orbitron', sans-serif;
font-size: 14px;
color: #ffaa00;
font-weight: bold;
}

/* Window Window Buttons Area */
.window-controls {
display: flex;
gap: 8px;
}

.win-btn {
width: 26px;
height: 26px;
border-radius: 50%;
border: none;
font-weight: bold;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 12px;
transition: 0.2s;
}

.btn-min { background: #ffcc00; color: #000; }
.btn-max { background: #00ff88; color: #000; }
.btn-close { background: #ff3333; color: #fff; }

.win-btn:hover { transform: scale(1.1); filter: brightness(1.2); }

/* Window Content Body Frame */
.window-body {
flex: 1;
width: 100%;
height: 100%;
background: #1f2937;
position: relative;
}

.window-body iframe {
width: 100%;
height: 100%;
border: none;
background: transparent;
}

/* Bottom corner resizer handle node */
.window-resizer {
width: 15px;
height: 15px;
background: #ffaa0055;
position: absolute;
right: 0;
bottom: 0;
cursor: se-resize;
border-radius: 50% 0 0 0;
}
</style>
</head>
<body>

<div class="main-container">

<div class="header-area">
<div class="title">💰 Bill Tracker Pro / Doc</div>
<button class="nav-btn" onclick="openCalcWindow()">Quick⚡ Calculator</button>
</div>

<div class="ui-card-box">
<div class="box-title">Document Tools</div>
<div class="doc-toolbar">
<button class="btn-tool" onclick="execCmd('bold')">B</button>
<button class="btn-tool" onclick="execCmd('italic')">I</button>
<button class="btn-tool" onclick="execCmd('underline')">U</button>
<button class="btn-tool" onclick="execCmd('justifyLeft')">Left</button>
<button class="btn-tool" onclick="execCmd('justifyCenter')">Center</button>
<button class="btn-tool" onclick="execCmd('justifyRight')">Right</button>

<select onchange="execCmd('foreColor', this.value); this.selectedIndex=0;">
<option value="" hidden>🎨 Text Color</option>
<option value="#00ffff">Cyan Neon</option>
<option value="#00ff88">Matrix Green</option>
<option value="#ff00ff">Cyber Pink</option>
<option value="#ffff00">Laser Yellow</option>
<option value="#ff3333">Flame Red</option>
<option value="#ffffff">Pure White</option>
</select>

<select onchange="execCmd('fontSize', this.value); this.selectedIndex=0;">
<option value="" hidden>📏 Size</option>
<option value="3">Small</option>
<option value="4">Normal</option>
<option value="5">Large</option>
<option value="6">Heading 1</option>
<option value="7">Ultra Big</option>
</select>
</div>
</div>

<div class="ui-card-box">
<div class="box-title">Document Workspace</div>
<div 
id="docEditor" 
class="google-doc-page" 
contenteditable="true" 
oninput="saveDocData()"></div>
</div>

<div class="ui-card-box">
<div class="box-title">Trending Emojis</div>
<div class="emoji-bar">
<button class="emoji-btn" onclick="insertEmoji('💰')">💰</button>
<button class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
<button class="emoji-btn" onclick="insertEmoji('👑')">👑</button>
<button class="emoji-btn" onclick="insertEmoji('🎮')">🎮</button>
<button class="emoji-btn" onclick="insertEmoji('🚀')">🚀</button>
<button class="emoji-btn" onclick="insertEmoji('💎')">💎</button>
<button class="emoji-btn" onclick="insertEmoji('✨')">✨</button>
<button class="emoji-btn" onclick="insertEmoji('⚠️')">⚠️</button>
</div>
</div>

<button class="resetBtn" onclick="hardResetDoc()">Reset All Data</button>

<div class="status-footer">
✓ Data Automatically Saved
</div>

</div>


<div id="calcWindow" class="calc-window">
    <div id="calcWindowHeader" class="window-header">
        <div class="window-title">⚡ Calculator</div>
        <div class="window-controls">
            <button class="win-btn btn-min" onclick="minimizeWindow()" title="Minimize">─</button>
            <button class="win-btn btn-max" onclick="maximizeWindow()" title="Maximize">🗖</button>
            <button class="win-btn btn-close" onclick="closeCalcWindow()" title="Close">✕</button>
        </div>
    </div>
    <div class="window-body">
        <iframe src="1.html"></iframe>
        <div id="windowResizer" class="window-resizer"></div>
    </div>
</div>


<script>
// ContentEditor Logic Code
const editor = document.getElementById("docEditor");
const savedDocText = localStorage.getItem("googleDocNeonText_v4");

if (savedDocText) {
editor.innerHTML = savedDocText;
} else {
editor.innerHTML = `Type here... ✨`;
}

function execCmd(command, value = null) {
document.execCommand(command, false, value);
saveDocData();
}

function saveDocData() {
localStorage.setItem("googleDocNeonText_v4", editor.innerHTML);
}

function insertEmoji(emoji) {
editor.focus();
document.execCommand('insertText', false, emoji);
saveDocData();
}

function hardResetDoc() {
let confirmAction = confirm("Are you sure you want to completely erase all text data?");
if (confirmAction) {
localStorage.removeItem("googleDocNeonText_v4");
editor.innerHTML = "";
alert("All document workspace data cleared successfully!");
}
}

// ============================================
// WINDOW CORE POPUP FUNCTIONS MECHANISM
// ============================================
const win = document.getElementById("calcWindow");
const winHeader = document.getElementById("calcWindowHeader");
const winResizer = document.getElementById("windowResizer");

let isMaximized = false;
let originalWidth = 360;
let originalHeight = 480;
let originalTop = "15%";
let originalLeft = "30%";

function openCalcWindow() {
    win.style.display = "flex";
}

function closeCalcWindow() {
    win.style.display = "none";
}

function minimizeWindow() {
    if(win.style.height === "45px") {
        win.style.height = isMaximized ? "100vh" : originalHeight + "px";
    } else {
        // Save current dynamic dimensions before minimize collapse
        if(!isMaximized) {
            originalHeight = win.offsetHeight;
        }
        win.style.height = "45px";
    }
}

function maximizeWindow() {
    if (!isMaximized) {
        // Save bounds states before expansion
        originalWidth = win.offsetWidth;
        originalHeight = win.offsetHeight;
        originalTop = win.style.top;
        originalLeft = win.style.left;

        win.style.width = "100vw";
        win.style.height = "100vh";
        win.style.top = "0px";
        win.style.left = "0px";
        isMaximized = true;
    } else {
        win.style.width = originalWidth + "px";
        win.style.height = originalHeight + "px";
        win.style.top = originalTop;
        win.style.left = originalLeft;
        isMaximized = false;
    }
}

// DRAGGABLE CONTROLLER SYSTEM (Eheta meheta adinnna)
dragElement(win);

function dragElement(elmnt) {
  let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  if (winHeader) {
    winHeader.onmousedown = dragMouseDown;
  }

  function dragMouseDown(e) {
    if(isMaximized) return; // Prevent drag if fully expanded
    e = e || window.event;
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onmouseup = closeDragElement;
    document.onmousemove = elementDrag;
  }

  function elementDrag(e) {
    e = e || window.event;
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
    elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
  }

  function closeDragElement() {
    document.onmouseup = null;
    document.onmousemove = null;
  }
}

// RESIZABLE ENGINE CONTROL (Loku / Podi karanna corner drag)
winResizer.addEventListener('mousedown', initResize, false);

function initResize(e) {
    if(isMaximized) return;
    window.addEventListener('mousemove', StartResize, false);
    window.addEventListener('mouseup', StopResize, false);
}
function StartResize(e) {
    win.style.width = (e.clientX - win.offsetLeft) + 'px';
    win.style.height = (e.clientY - win.offsetTop) + 'px';
}
function StopResize(e) {
    window.removeEventListener('mousemove', StartResize, false);
    window.removeEventListener('mouseup', StopResize, false);
}
</script>

</body>
</html>
