<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Tracker Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0a0f1f;
color:white;
padding:20px;
min-height:100vh;
position: relative;
overflow-x: hidden;
}

/* Header UI Layout */
.header-container {
display: flex;
align-items: center;
justify-content: center;
gap: 15px;
margin-bottom: 20px;
position: relative;
max-width: 700px;
margin-left: auto;
margin-right: auto;
}

/* Logo Setup */
.logo-area {
width: 50px;
height: 50px;
border: 2px dashed #00ffff;
border-radius: 10px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
overflow: hidden;
background: #111827;
transition: 0.3s;
position: absolute;
left: 0;
}

.logo-area:hover {
box-shadow: 0 0 10px #00ffff;
}

.logo-area img {
width: 100%;
height: 100%;
object-fit: cover;
}

.logo-placeholder {
font-size: 10px;
color: #00ffff;
text-align: center;
font-weight: bold;
}

.title{
font-size:2rem;
color:#00ffff;
text-shadow:
0 0 10px #00ffff,
0 0 20px #00ffff,
0 0 40px #00ffff;
display: flex;
align-items: center;
gap: 10px;
}

/* Menu Toggle Button (Shan - ☰) */
.menu-toggle {
font-size: 30px;
color: #00ffff;
cursor: pointer;
background: none;
border: none;
padding: 0;
width: auto;
margin: 0;
position: absolute;
right: 0;
text-shadow: 0 0 10px #00ffff;
transition: 0.3s;
}

.menu-toggle:hover {
transform: scale(1.1);
}

/* Sidebar Menu Design */
.sidebar {
position: fixed;
top: 0;
left: -280px;
width: 280px;
height: 100%;
background: #0d1527;
border-right: 2px solid #00ffff;
box-shadow: 5px 0 15px #00ffff33;
transition: 0.4s ease;
z-index: 1000;
padding: 20px;
}

.sidebar.active {
left: 0;
}

.close-btn {
font-size: 25px;
color: #ff3333;
cursor: pointer;
text-align: right;
margin-bottom: 20px;
font-weight: bold;
}

.sidebar-menu-item {
display: flex;
align-items: center;
justify-content: space-between;
background: #111827;
border: 1px solid #00ffff33;
padding: 12px 15px;
border-radius: 12px;
margin-bottom: 15px;
text-decoration: none;
color: white;
transition: 0.3s;
}

.sidebar-menu-item:hover {
border-color: #00ffff;
box-shadow: 0 0 10px #00ffff44;
background: #1f2937;
}

.sidebar-menu-item span {
font-size: 16px;
font-weight: 500;
}

.sidebar-menu-item img {
width: 24px;
height: 24px;
filter: drop-shadow(0 0 2px #00ffff);
}

/* Overlay background when menu opens */
.sidebar-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.5);
display: none;
z-index: 999;
}

.sidebar-overlay.active {
display: block;
}

/* Container & Rest of the layout */
.container {
max-width:700px;
margin:auto;
}

.card{
background:#111827;
border:2px solid #00ffff;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 15px #00ffff55;
}

.card h2{
margin-bottom:15px;
color:#00ffff;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:#1f2937;
color:white;
font-size:16px;
outline:none;
}

input:focus{
box-shadow:0 0 10px #00ffff;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.addBtn{
background:#00ffff;
color:black;
}

.addBtn:hover{
box-shadow:0 0 20px #00ffff;
}

.resetBtn{
background:#ff3333;
color:white;
}

.resetBtn:hover{
box-shadow:0 0 20px red;
}

.expense{
background:#1f2937;
padding:12px;
border-radius:12px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.deleteBtn{
background:red;
color:white;
width:auto;
padding:8px 15px;
margin:0;
}

.summary{
font-size:20px;
font-weight:bold;
}

.red{
color:#ff4444;
}

.green{
color:#00ff88;
}

.footer{
text-align:center;
margin-top:20px;
opacity:.7;
}

/* Hidden File Input for Logo */
#logoInput {
display: none;
}

</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
<div class="close-btn" onclick="toggleMenu()">✕</div>

<a href="1.html" class="sidebar-menu-item">
<span>⚡ Calculator</span>
<img src="https://github.com/Lakmina348/Calculator-Ai-App/blob/main/images/OIP.jpg?raw=true" alt="GitHub">
</a>

<a href="2.html" class="sidebar-menu-item">
<span>Text PDF</span>
<img src="https://github.com/Lakmina348/Calculator-Ai-App/blob/main/images/OIP%20(1).jpg?raw=true" alt="GitHub">
</a>

<a href="https://lakmina348.github.io/-/" class="sidebar-menu-item">
<span>Admin</span>
<img src="https://github.com/Lakmina348/Calculator-Ai-App/blob/main/images/OIP%20(2).jpg?raw=true" alt="GitHub">
</a>
</div>

<div class="container">

<div class="header-container">
<div class="logo-area" onclick="triggerLogoUpload()" id="logoContainer">
<div class="logo-placeholder" id="logoPlaceholder">ADD LOGO</div>
</div>
<input type="file" id="logoInput" accept="image/*" onchange="loadLogo(event)">

<h1 class="title">💰 Bill Tracker Pro</h1>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>
</div>

<div class="card">
<h2>Monthly Salary</h2>
<input type="number" id="salary" placeholder="Enter Salary">
<button class="addBtn" onclick="saveSalary()">Save Salary</button>
</div>

<div class="card">
<h2>Add Expense</h2>
<input type="text" id="expenseName" placeholder="Expense Name">
<input type="number" id="expenseAmount" placeholder="Amount (Rs)">
<button class="addBtn" onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h2>Expense List</h2>
<div id="expenses"></div>
</div>

<div class="card">
<div class="summary">Total Expenses : <span class="red" id="totalExpense">Rs.0</span></div>
<br>
<div class="summary">Remaining Balance : <span class="green" id="remaining">Rs.0</span></div>
<button class="resetBtn" onclick="resetData()">Reset All Data</button>
</div>

<div class="footer">
✔ Data Automatically Saved
</div>

</div>

<script>

let salary = Number(localStorage.getItem("salary")) || 0;
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

document.getElementById("salary").value = salary || "";

// Sidebar Toggle Function
function toggleMenu() {
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("sidebarOverlay");
sidebar.classList.toggle("active");
overlay.classList.toggle("active");
}

// Logo Upload Logic with LocalStorage Persistence
function triggerLogoUpload() {
document.getElementById("logoInput").click();
}

function loadLogo(event) {
const file = event.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(e) {
const imageData = e.target.result;
localStorage.setItem("trackedLogo", imageData);
displayLogo(imageData);
};
reader.readAsDataURL(file);
}
}

function displayLogo(src) {
const container = document.getElementById("logoContainer");
container.innerHTML = `<img src="${src}" alt="Logo">`;
}

// Check if Logo exists on refresh
if (localStorage.getItem("trackedLogo")) {
displayLogo(localStorage.getItem("trackedLogo"));
}

function saveSalary(){
salary = Number(document.getElementById("salary").value);
localStorage.setItem("salary", salary);
updateUI();
alert("Salary saved successfully.");
}

function addExpense(){
let name = document.getElementById("expenseName").value.trim();
let amount = Number(document.getElementById("expenseAmount").value);

if(!name || !amount){
alert("Please fill all fields.");
return;
}

expenses.push({name:name, amount:amount});
localStorage.setItem("expenses", JSON.stringify(expenses));

document.getElementById("expenseName").value="";
document.getElementById("expenseAmount").value="";

updateUI();
alert("Expense added successfully.");
}

function deleteExpense(index){
let confirmDelete = confirm("Are you sure you want to delete this expense?");
if(confirmDelete){
expenses.splice(index,1);
localStorage.setItem("expenses", JSON.stringify(expenses));
updateUI();
alert("Expense deleted successfully.");
}
}

function resetData(){
let confirmReset = confirm("Are you sure you want to reset all data?");
if(confirmReset){
localStorage.removeItem("salary");
localStorage.removeItem("expenses");
localStorage.removeItem("trackedLogo");

salary = 0;
expenses = [];

document.getElementById("salary").value="";
document.getElementById("logoContainer").innerHTML = `<div class="logo-placeholder" id="logoPlaceholder">ADD LOGO</div>`;

updateUI();
alert("All data has been reset successfully.");
}
}

function updateUI(){
let expenseBox = document.getElementById("expenses");
expenseBox.innerHTML="";
let total = 0;

expenses.forEach((item,index)=>{
total += item.amount;
expenseBox.innerHTML += `
<div class="expense">
<div>
<strong>${item.name}</strong><br>
Rs.${item.amount.toLocaleString()}
</div>
<button class="deleteBtn" onclick="deleteExpense(${index})">Delete</button>
</div>
`;
});

document.getElementById("totalExpense").innerText = "Rs." + total.toLocaleString();
document.getElementById("remaining").innerText = "Rs." + (salary-total).toLocaleString();
}

updateUI();

</script>

</body>
</html>
