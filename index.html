<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Tracker Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0a0f1f;
color:white;
padding:20px;
min-height:100vh;
position: relative;
overflow-x: hidden;
}

/* Header UI Layout */
.header-container {
display: flex;
align-items: center;
justify-content: center;
gap: 15px;
margin-bottom: 20px;
position: relative;
max-width: 700px;
margin-left: auto;
margin-right: auto;
}

/* Logo Setup */
.logo-area {
width: 50px;
height: 50px;
border: 2px dashed #00ffff;
border-radius: 10px;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
overflow: hidden;
background: #111827;
transition: 0.3s;
position: absolute;
left: 0;
}

.logo-area:hover {
box-shadow: 0 0 10px #00ffff;
}

.logo-area img {
width: 100%;
height: 100%;
object-fit: cover;
}

.logo-placeholder {
font-size: 10px;
color: #00ffff;
text-align: center;
font-weight: bold;
}

.title{
font-size:2rem;
color:#00ffff;
text-shadow:
0 0 10px #00ffff,
0 0 20px #00ffff,
0 0 40px #00ffff;
display: flex;
align-items: center;
gap: 10px;
}

/* Menu Toggle Button (Shan - ☰) */
.menu-toggle {
font-size: 30px;
color: #00ffff;
cursor: pointer;
background: none;
border: none;
padding: 0;
width: auto;
margin: 0;
position: absolute;
right: 0;
text-shadow: 0 0 10px #00ffff;
transition: 0.3s;
}

.menu-toggle:hover {
transform: scale(1.1);
}

/* Sidebar Menu Design */
.sidebar {
position: fixed;
top: 0;
left: -280px;
width: 280px;
height: 100%;
background: #0d1527;
border-right: 2px solid #00ffff;
box-shadow: 5px 0 15px #00ffff33;
transition: 0.4s ease;
z-index: 1000;
padding: 20px;
}

.sidebar.active {
left: 0;
}

.close-btn {
font-size: 25px;
color: #ff3333;
cursor: pointer;
text-align: right;
margin-bottom: 20px;
font-weight: bold;
}

.sidebar-menu-item {
display: flex;
align-items: center;
justify-content: space-between;
background: #111827;
border: 1px solid #00ffff33;
padding: 12px 15px;
border-radius: 12px;
margin-bottom: 15px;
text-decoration: none;
color: white;
transition: 0.3s;
}

.sidebar-menu-item:hover {
border-color: #00ffff;
box-shadow: 0 0 10px #00ffff44;
background: #1f2937;
}

.sidebar-menu-item span {
font-size: 16px;
font-weight: 500;
}

.sidebar-menu-item img {
width: 24px;
height: 24px;
filter: drop-shadow(0 0 2px #00ffff);
}

/* Overlay background when menu opens */
.sidebar-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.5);
display: none;
z-index: 999;
}

.sidebar-overlay.active {
display: block;
}

/* Container & Rest of the layout */
.container {
max-width:700px;
margin:auto;
}

.card{
background:#111827;
border:2px solid #00ffff;
border-radius:20px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 15px #00ffff55;
}

.card h2{
margin-bottom:15px;
color:#00ffff;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:#1f2937;
color:white;
font-size:16px;
outline:none;
}

input:focus{
box-shadow:0 0 10px #00ffff;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.addBtn{
background:#00ffff;
color:black;
}

.addBtn:hover{
box-shadow:0 0 20px #00ffff;
}

.pdfBtn {
background: #00ff88;
color: #0a0f1f;
margin-top: 15px;
}

.pdfBtn:hover {
box-shadow: 0 0 20px #00ff88;
}

.resetBtn{
background:#ff3333;
color:white;
}

.resetBtn:hover{
box-shadow:0 0 20px red;
}

.expense{
background:#1f2937;
padding:12px;
border-radius:12px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.deleteBtn{
background:red;
color:white;
width:auto;
padding:8px 15px;
margin:0;
}

.summary{
font-size:20px;
font-weight:bold;
}

.red{
color:#ff4444;
}

.green{
color:#00ff88;
}

.footer{
text-align:center;
margin-top:20px;
opacity:.7;
}

/* Hidden File Input for Logo */
#logoInput {
display: none;
}

</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
<div class="close-btn" onclick="toggleMenu()">✕</div>

<a href="1.html" class="sidebar-menu-item">
<span>⚡ Calculator</span>
<img src="https://github.com/Lakmina348/Calculator-Ai-App/blob/main/images/OIP.jpg?raw=true" alt="GitHub">
</a>

<a href="3.html" class="sidebar-menu-item">
<span>Text PDF</span>
<img src="https://github.com/Lakmina348/Calculator-Ai-App/blob/main/images/OIP%20(1).jpg?raw=true" alt="GitHub">
</a>

<a href="https://lakmina348.github.io/-/" class="sidebar-menu-item">
<span>Admin</span>
<img src="https://github.com/Lakmina348/Calculator-Ai-App/blob/main/images/OIP%20(2).jpg?raw=true" alt="GitHub">
</a>
</div>

<div class="container">

<div class="header-container">
<div class="logo-area" onclick="triggerLogoUpload()" id="logoContainer">
<div class="logo-placeholder" id="logoPlaceholder">ADD LOGO</div>
</div>
<input type="file" id="logoInput" accept="image/*" onchange="loadLogo(event)">

<h1 class="title">💰 Bill Tracker Pro</h1>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>
</div>

<div class="card">
<h2>Monthly Salary</h2>
<input type="number" id="salary" placeholder="Enter Salary" oninput="liveUpdateSalary()">
<button class="addBtn" onclick="saveSalary()">Save Salary</button>
</div>

<div class="card">
<h2>Add Expense</h2>
<input type="text" id="expenseName" placeholder="Expense Name">
<input type="number" id="expenseAmount" placeholder="Amount (Rs)">
<button class="addBtn" onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
<h2>Expense List</h2>
<div id="expenses"></div>
</div>

<div class="card">
<div class="summary">Total Expenses : <span class="red" id="totalExpense">Rs.0</span></div>
<br>
<div class="summary">Remaining Balance : <span class="green" id="remaining">Rs.0</span></div>
<button class="pdfBtn" onclick="generatePDF()">📥 Download Statement PDF</button>
<button class="resetBtn" onclick="resetData()">Reset All Data</button>
</div>

<div class="footer">
✔ Data Automatically Saved
</div>

</div>

<script>

let salary = Number(localStorage.getItem("salary")) || 0;
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

document.getElementById("salary").value = salary || "";

// Sidebar Toggle Function
function toggleMenu() {
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("sidebarOverlay");
sidebar.classList.toggle("active");
overlay.classList.toggle("active");
}

// Logo Upload Logic with LocalStorage Persistence
function triggerLogoUpload() {
document.getElementById("logoInput").click();
}

function loadLogo(event) {
const file = event.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(e) {
const imageData = e.target.result;
localStorage.setItem("trackedLogo", imageData);
displayLogo(imageData);
};
reader.readAsDataURL(file);
}
}

function displayLogo(src) {
const container = document.getElementById("logoContainer");
container.innerHTML = `<img src="${src}" alt="Logo">`;
}

// Check if Logo exists on refresh
if (localStorage.getItem("trackedLogo")) {
displayLogo(localStorage.getItem("trackedLogo"));
}

function liveUpdateSalary(){
salary = Number(document.getElementById("salary").value) || 0;
localStorage.setItem("salary", salary);
updateUI();
}

function saveSalary(){
salary = Number(document.getElementById("salary").value) || 0;
localStorage.setItem("salary", salary);
updateUI();
alert("Salary saved successfully.");
}

function addExpense(){
let name = document.getElementById("expenseName").value.trim();
let amount = Number(document.getElementById("expenseAmount").value);

if(!name || !amount){
alert("Please fill all fields.");
return;
}

expenses.push({name:name, amount:amount});
localStorage.setItem("expenses", JSON.stringify(expenses));

document.getElementById("expenseName").value="";
document.getElementById("expenseAmount").value="";

updateUI();
alert("Expense added successfully.");
}

function deleteExpense(index){
let confirmDelete = confirm("Are you sure you want to delete this expense?");
if(confirmDelete){
expenses.splice(index,1);
localStorage.setItem("expenses", JSON.stringify(expenses));
updateUI();
alert("Expense deleted successfully.");
}
}

function resetData(){
let confirmReset = confirm("Are you sure you want to reset all data?");
if(confirmReset){
localStorage.removeItem("salary");
localStorage.removeItem("expenses");
localStorage.removeItem("trackedLogo");

salary = 0;
expenses = [];

document.getElementById("salary").value="";
document.getElementById("logoContainer").innerHTML = `<div class="logo-placeholder" id="logoPlaceholder">ADD LOGO</div>`;

updateUI();
alert("All data has been reset successfully.");
}
}

function updateUI(){
let expenseBox = document.getElementById("expenses");
expenseBox.innerHTML="";
let total = 0;

expenses.forEach((item,index)=>{
total += item.amount;
expenseBox.innerHTML += `
<div class="expense">
<div>
<strong>${item.name}</strong><br>
Rs.${item.amount.toLocaleString()}
</div>
<button class="deleteBtn" onclick="deleteExpense(${index})">Delete</button>
</div>
`;
});

let currentSalary = Number(document.getElementById("salary").value) || salary;

document.getElementById("totalExpense").innerText = "Rs." + total.toLocaleString();
document.getElementById("remaining").innerText = "Rs." + (currentSalary - total).toLocaleString();
}

// Premium Dark style PDF generator
function generatePDF() {
let currentSalary = Number(document.getElementById("salary").value) || salary;

if (expenses.length === 0 && currentSalary === 0) {
alert("No data available to download!");
return;
}

let totalExpense = 0;
expenses.forEach(item => totalExpense += Number(item.amount));
let remainingBalance = currentSalary - totalExpense;

let expensePercentage = currentSalary > 0 ? ((totalExpense / currentSalary) * 100).toFixed(1) : "0.0";

let expenseRows = "";
expenses.forEach((item, index) => {
let itemAmount = Number(item.amount);
let itemPercentage = currentSalary > 0 ? ((itemAmount / currentSalary) * 100).toFixed(1) : "0.0";
expenseRows += `
<tr style="border-bottom: 1px solid #1f2937;">
<td style="padding: 15px; color: #a1a1aa; font-size: 14px; text-align: left;">${index + 1}</td>
<td style="padding: 15px; color: white; font-weight: 600; font-size: 15px; text-align: left;">${item.name}</td>
<td style="padding: 15px; color: #ff4444; font-weight: bold; font-size: 15px; text-align: right;">Rs. ${itemAmount.toLocaleString()}</td>
<td style="padding: 15px; color: #00ffff; font-size: 13px; text-align: right; font-weight: 500;">${itemPercentage}%</td>
</tr>
`;
});

let logoSrc = localStorage.getItem("trackedLogo") || "";
let logoHtml = logoSrc ? `<img src="${logoSrc}" style="width: 55px; height: 55px; object-fit: cover; border-radius: 12px; border: 2px solid #00ffff;">` : `<div style="font-weight:bold; color:#00ffff; font-size:18px; text-shadow: 0 0 5px #00ffff;">💰 BILL TRACKER PRO</div>`;

const element = document.createElement('div');
element.innerHTML = `
<div style="padding: 40px; font-family: 'Segoe UI', Arial, sans-serif; background: #0a0f1f; color: white; min-height: 842px; box-sizing: border-box;">
<table style="width: 100%; margin-bottom: 35px; border-collapse: collapse;">
<tr>
<td>${logoHtml}</td>
<td style="text-align: right;">
<h1 style="margin: 0; color: #00ffff; font-size: 26px; text-shadow: 0 0 10px rgba(0,255,255,0.3); font-weight: 800; letter-spacing: 0.5px;">Financial Statement</h1>
<p style="margin: 6px 0 0 0; color: #94a3b8; font-size: 13px;">Statement Date: ${new Date().toLocaleDateString()}</p>
</td>
</tr>
</table>

<div style="display: flex; gap: 15px; margin-bottom: 35px;">
<div style="flex: 1; background: #111827; border: 2px solid #00ffff; padding: 18px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,255,255,0.1);">
<span style="font-size: 11px; color: #00ffff; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">Monthly Salary</span>
<h3 style="margin: 8px 0 0 0; color: white; font-size: 22px; font-weight: 700;">Rs. ${currentSalary.toLocaleString()}</h3>
</div>
<div style="flex: 1; background: #111827; border: 1px solid #ff4444; padding: 18px; border-radius: 16px;">
<span style="font-size: 11px; color: #ff4444; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">Total Spent (${expensePercentage}%)</span>
<h3 style="margin: 8px 0 0 0; color: #ff4444; font-size: 22px; font-weight: 700;">Rs. ${totalExpense.toLocaleString()}</h3>
</div>
<div style="flex: 1; background: #111827; border: 1px solid #00ff88; padding: 18px; border-radius: 16px;">
<span style="font-size: 11px; color: #00ff88; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">Net Remaining</span>
<h3 style="margin: 8px 0 0 0; color: #00ff88; font-size: 22px; font-weight: 700;">Rs. ${remainingBalance.toLocaleString()}</h3>
</div>
</div>

<h3 style="margin-bottom: 20px; color: #00ffff; font-size: 18px; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid #1f2937; letter-spacing: 0.5px;">
📊 Itemized Expense Analysis
</h3>

<table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
<thead>
<tr style="background: #111827; color: #00ffff; text-align: left; border: 1px solid #00ffff33;">
<th style="padding: 14px; border-top-left-radius: 12px; border-bottom-left-radius: 12px; font-size: 13px; font-weight: bold; text-transform: uppercase; text-align: left;">#</th>
<th style="padding: 14px; font-size: 13px; font-weight: bold; text-transform: uppercase; text-align: left;">Expense Category / Name</th>
<th style="padding: 14px; text-align: right; font-size: 13px; font-weight: bold; text-transform: uppercase;">Amount Paid</th>
<th style="padding: 14px; text-align: right; border-top-right-radius: 12px; border-bottom-right-radius: 12px; font-size: 13px; font-weight: bold; text-transform: uppercase;">% of Income</th>
</tr>
</thead>
<tbody>
${expenseRows}
</tbody>
</table>

<div style="text-align: center; margin-top: 80px; padding-top: 20px; border-top: 1px solid #1f2937; color: #64748b; font-size: 12px; letter-spacing: 0.5px;">
Generated securely by <strong>Bill Tracker Pro</strong>. Manage your wealth efficiently.
</div>
</div>
`;

const options = {
margin: 8,
filename: 'Bill_Tracker_Statement.pdf',
image: { type: 'jpeg', quality: 0.98 },
html2canvas: { scale: 2, useCORS: true, backgroundColor: '#0a0f1f' },
jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
};

html2pdf().from(element).set(options).save();
}

updateUI();

</script>

</body>
</html>
