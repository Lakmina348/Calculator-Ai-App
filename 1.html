<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Calc Pro</title>

<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', sans-serif;
}

body {
background: #0a0f1f;
color: white;
padding: 20px;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

.calc-container {
width: 100%;
max-width: 400px;
background: #111827;
border: 2px solid #00ffff;
border-radius: 24px;
padding: 20px;
box-shadow: 0 0 25px #00ffff44;
}

/* Screen Display */
.screen {
background: #1f2937;
border: 1px solid #00ffff33;
border-radius: 16px;
padding: 15px;
text-align: right;
margin-bottom: 20px;
box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

#previous-operation {
font-size: 16px;
color: #00ffffaa;
min-height: 20px;
margin-bottom: 5px;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}

#current-output {
font-size: 32px;
font-weight: bold;
color: #00ffff;
text-shadow: 0 0 10px #00ffff88;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}

/* Buttons Grid */
.buttons-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 12px;
margin-bottom: 20px;
}

button {
padding: 18px;
font-size: 20px;
font-weight: bold;
border: none;
border-radius: 12px;
cursor: pointer;
transition: 0.2s;
background: #1f2937;
color: white;
display: flex;
justify-content: center;
align-items: center;
}

button:active {
transform: scale(0.95);
}

.operator {
color: #00ff88;
text-shadow: 0 0 5px #00ff8888;
}

.operator:hover {
box-shadow: 0 0 15px #00ff8855;
background: #00ff8822;
}

.number:hover {
box-shadow: 0 0 15px #00ffff33;
background: #111827;
border: 1px solid #00ffff33;
}

.clear {
color: #ff3333;
text-shadow: 0 0 5px #ff333388;
}

.clear:hover {
box-shadow: 0 0 15px #ff333355;
background: #ff333322;
}

.backspace {
color: #ffaa00;
text-shadow: 0 0 5px #ffaa0088;
}

.backspace:hover {
box-shadow: 0 0 15px #ffaa0055;
background: #ffaa0022;
}

.equal {
grid-column: span 2;
background: #00ffff;
color: black;
}

.equal:hover {
box-shadow: 0 0 20px #00ffff;
}

/* History Section */
.history-section {
background: #0d1527;
border: 1px solid #00ffff22;
border-radius: 16px;
padding: 15px;
margin-bottom: 20px;
max-height: 220px;
overflow-y: auto;
}

.history-section h3 {
font-size: 14px;
color: #00ffff;
margin-bottom: 10px;
text-transform: uppercase;
letter-spacing: 1px;
}

.history-item {
font-size: 14px;
color: #a0aec0;
padding: 8px;
border-bottom: 1px solid #1f2937;
display: flex;
justify-content: space-between;
align-items: center;
border-radius: 8px;
margin-bottom: 5px;
transition: 0.3s;
}

.history-data {
display: flex;
flex-direction: column;
width: 75%;
}

.history-data span {
color: #00ff88;
font-weight: bold;
}

.hist-del-btn {
background: #ff333322;
color: #ff3333;
border: 1px solid #ff333344;
padding: 5px 10px;
font-size: 12px;
border-radius: 6px;
cursor: pointer;
width: auto;
margin: 0;
}

/* Deleting / Live Countdown State */
.history-item.deleting {
background: #ff333311;
border: 1px dashed #ff3333aa;
cursor: pointer;
}

.deleting-text {
color: #ffaa00 !important;
font-size: 13px;
font-weight: bold;
display: flex;
align-items: center;
gap: 5px;
}

.countdown-num {
color: #ff3333;
background: rgba(255, 51, 51, 0.15);
padding: 2px 8px;
border-radius: 4px;
font-size: 14px;
border: 1px solid #ff333344;
display: inline-block;
}

/* Custom Scrollbar for History */
.history-section::-webkit-scrollbar {
width: 6px;
}
.history-section::-webkit-scrollbar-thumb {
background: #00ffff44;
border-radius: 10px;
}

/* Reset Button */
.resetBtn {
width: 100%;
padding: 12px;
background: #ff3333;
color: white;
font-size: 16px;
font-weight: bold;
border-radius: 12px;
border: none;
cursor: pointer;
transition: 0.3s;
}

.resetBtn:hover {
box-shadow: 0 0 20px red;
}
</style>
</head>
<body>

<div class="calc-container">

<div class="screen">
<div id="previous-operation"></div>
<div id="current-output">0</div>
</div>

<div class="buttons-grid">
<button class="clear" onclick="clearScreen()">C</button>
<button class="backspace" onclick="backspace()">⌫</button>
<button class="operator" onclick="appendOperator('/')">/</button>
<button class="operator" onclick="appendOperator('*')">×</button>

<button class="number" onclick="appendNumber('7')">7</button>
<button class="number" onclick="appendNumber('8')">8</button>
<button class="number" onclick="appendNumber('9')">9</button>
<button class="operator" onclick="appendOperator('-')">-</button>

<button class="number" onclick="appendNumber('4')">4</button>
<button class="number" onclick="appendNumber('5')">5</button>
<button class="number" onclick="appendNumber('6')">6</button>
<button class="operator" onclick="appendOperator('+')">+</button>

<button class="number" onclick="appendNumber('1')">1</button>
<button class="number" onclick="appendNumber('2')">2</button>
<button class="number" onclick="appendNumber('3')">3</button>
<button class="equal" onclick="calculateResult()">=</button>

<button class="number" onclick="appendNumber('0')" style="grid-column: span 2; width: 100%;">0</button>
<button class="number" onclick="appendNumber('.')">.</button>
</div>

<div class="history-section">
<h3>📊 Calculations History</h3>
<div id="history-list"></div>
</div>

<button class="resetBtn" onclick="resetAllData()">Reset All Data</button>

</div>

<script>
let currentInput = localStorage.getItem("calcCurrent") || "0";
let previousInput = localStorage.getItem("calcPrevious") || "";
let calcHistory = JSON.parse(localStorage.getItem("calcHistory")) || [];
let activeIntervals = {}; // For live countdown (10,9,8...)

// Initial UI Load
updateDisplay();
renderHistory();

function appendNumber(num) {
if (currentInput === "0" && num !== ".") {
currentInput = num;
} else {
if (num === "." && currentInput.includes(".")) return;
currentInput += num;
}
saveState();
updateDisplay();
}

function backspace() {
if (currentInput.length > 0 && currentInput !== "0") {
currentInput = currentInput.slice(0, -1);
if (currentInput === "" || currentInput === "-") {
currentInput = "0";
}
saveState();
updateDisplay();
}
}

function appendOperator(op) {
if (currentInput === "") {
if (previousInput !== "") {
previousInput = previousInput.slice(0, -1) + op;
}
} else {
if (previousInput !== "") {
calculateResult(true);
}
previousInput = currentInput + " " + op;
currentInput = "";
}
saveState();
updateDisplay();
}

function clearScreen() {
currentInput = "0";
previousInput = "";
saveState();
updateDisplay();
}

function calculateResult(isChaining = false) {
if (previousInput === "" || currentInput === "") return;

let expression = previousInput + " " + currentInput;
let result;

try {
result = eval(expression);
result = parseFloat(result.toFixed(8)); 
} catch (error) {
result = "Error";
}

if (!isChaining && result !== "Error") {
let uniqueId = "hist_" + Date.now();
calcHistory.unshift({
id: uniqueId,
exp: expression,
res: result
});
if (calcHistory.length > 20) calcHistory.pop();
localStorage.setItem("calcHistory", JSON.stringify(calcHistory));
renderHistory();
}

previousInput = isChaining ? result + " " + previousInput.slice(-1) : "";
currentInput = result.toString();
saveState();
updateDisplay();
}

function updateDisplay() {
document.getElementById("current-output").innerText = currentInput;
document.getElementById("previous-operation").innerText = previousInput;
}

function renderHistory() {
const historyList = document.getElementById("history-list");
historyList.innerHTML = "";
if (calcHistory.length === 0) {
historyList.innerHTML = `<div style="color: #6b7280; font-size: 13px;">No history recorded yet.</div>`;
return;
}
calcHistory.forEach(item => {
const div = document.createElement("div");
div.className = "history-item";
div.id = item.id;
div.innerHTML = `
<div class="history-data">
<small style="color:#6b7280;">${item.exp}</small>
<span>${item.res}</span>
</div>
<button class="hist-del-btn" onclick="startDeleteCountdown(event, '${item.id}')">🗑️</button>
`;
historyList.appendChild(div);
});
}

// 10s Live Countdown System (10 to 0)
function startDeleteCountdown(event, id) {
event.stopPropagation(); 
const itemRow = document.getElementById(id);
if (!itemRow) return;

let timeLeft = 10; // Start at 10 seconds

// Shift to dynamic countdown UI
itemRow.className = "history-item deleting";
itemRow.setAttribute("onclick", `cancelDelete('${id}')`);
itemRow.innerHTML = `
<div class="history-data">
<span class="deleting-text">
⏱️ Deleting in <span class="countdown-num" id="count_${id}">10s</span>
</span>
<small style="color:#a0aec0; margin-top:2px;">Touch anywhere here to Keep</small>
</div>
`;

// Run interval to tick every 1 second
activeIntervals[id] = setInterval(() => {
timeLeft--;
const countSpan = document.getElementById(`count_${id}`);


if (countSpan) {
countSpan.innerText = timeLeft + "s";
}

// When countdown hits 0, delete data
if (timeLeft <= 0) {
clearInterval(activeIntervals[id]);
delete activeIntervals[id];

calcHistory = calcHistory.filter(item => item.id !== id);
localStorage.setItem("calcHistory", JSON.stringify(calcHistory));
renderHistory();
}
}, 1000);
}

// Cancel action and restore data if touched within 10s
function cancelDelete(id) {
if (activeIntervals[id]) {
clearInterval(activeIntervals[id]); // Stop countdown ticks
delete activeIntervals[id];
renderHistory(); // Put back to safe state
}
}

function saveState() {
localStorage.setItem("calcCurrent", currentInput);
localStorage.setItem("calcPrevious", previousInput);
}

function resetAllData() {
let confirmReset = confirm("Are you sure you want to reset all calculator data and history?");
if (confirmReset) {
// Clear any running countdowns
Object.keys(activeIntervals).forEach(id => clearInterval(activeIntervals[id]));
activeIntervals = {};

localStorage.removeItem("calcCurrent");
localStorage.removeItem("calcPrevious");
localStorage.removeItem("calcHistory");

currentInput = "0";
previousInput = "";
calcHistory = [];

updateDisplay();
renderHistory();
alert("Calculator has been fully reset.");
}
}
</script>

</body>
</html>
